<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul class="flashes">
      {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

    <ul>
        {% for filename in files %}
            <li style="padding:5px;">
                <a href="/calls?pcapname={{ filename }}">{{ filename }} &nbsp;&nbsp;</a>
                <form method="post" action="/delete-file" style="display:inline;">
                    <input type="hidden" name="filename" value="{{ filename }}">
                    <button style="font-size: 10px;" onclick="return confirm('Are you sure you want to delete this file : {{ filename }}?')">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <div id="drop-area">
        Drag & Drop files here <br>
        <input type="file" id="file-input" accept=".pcap,.pcapng">
        Or <button id="upload-btn">Click here to Upload</button>
    </div>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
